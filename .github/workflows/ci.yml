name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, phase* ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Test Database Scripts and Integrity
  database-tests:
    name: Database Schema & Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client

      - name: Execute DDL (Schema)
        env:
          PGPASSWORD: test_password
        run: psql -h localhost -U test_user -d test_db -f database/scripts/schema.sql

      - name: Insert Seed Data
        env:
          PGPASSWORD: test_password
        run: psql -h localhost -U test_user -d test_db -f database/scripts/init.sql

      - name: Create Stored Procedures & Triggers
        env:
          PGPASSWORD: test_password
        run: psql -h localhost -U test_user -d test_db -f database/scripts/procedures.sql

      - name: Test Analytical Queries
        env:
          PGPASSWORD: test_password
        run: psql -h localhost -U test_user -d test_db -f database/scripts/queries.sql

  # Job 2: Build Docker Images (Backend & Frontend)
  docker-build-tests:
    name: Build Docker Images (Backend & Frontend)
    runs-on: ubuntu-latest
    needs: database-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend (FastAPI) Image
        run: docker build -t sports-backend:test ./backend

      - name: Build Frontend (React+Nginx) Image
        run: docker build -t sports-frontend:test ./frontend